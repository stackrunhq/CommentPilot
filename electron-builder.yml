# Preserve the installer identity so the renamed product upgrades existing installs.
appId: com.local.douyinreply.workbench
productName: CommentPilot
asar: true
npmRebuild: false
directories:
  output: release
files:
  - desktop/**/*
  - build/icon.png
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: release/stage/backend
    to: backend
  - from: release/stage/backend/node_modules
    to: backend/node_modules
  - from: release/stage/browsers
    to: browsers
  - from: docs/安装版使用说明.md
    to: 使用说明.md
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  installerLanguages:
    - zh_CN
    - en_US
artifactName: CommentPilot-Setup-${version}-${arch}.${ext}
